name: Fork build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the version is the commit count

      - uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: zulu

      - uses: gradle/actions/setup-gradle@v5

      - name: CI gradle.properties
        run: |
          mkdir -p ~/.gradle
          cp .github/runner-files/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Test, lint, build jar
        run: ./gradlew :server:test ktlintCheck :server:shadowJar --stacktrace

      - name: Jar name and version
        id: jar
        run: |
          jar=$(ls server/build/Suwayomi-Server-*.jar)
          echo "path=$jar" >> "$GITHUB_OUTPUT"
          echo "version=$(basename "$jar" .jar | sed 's/^Suwayomi-Server-//')" >> "$GITHUB_OUTPUT"

      - if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v3

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: fork.Dockerfile
          build-args: JAR=${{ steps.jar.outputs.path }}
          push: true
          tags: |
            ghcr.io/paymonr/suwayomi-server:${{ steps.jar.outputs.version }}
            ghcr.io/paymonr/suwayomi-server:main
