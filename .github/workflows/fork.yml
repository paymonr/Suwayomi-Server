name: Fork build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # only main publishes; pull requests and other branches build the image without pushing it
      PUBLISH: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the image tag carries the commit count

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 25
          distribution: zulu

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: CI gradle.properties
        run: |
          mkdir -p ~/.gradle
          cp .github/runner-files/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Test, lint, bundle the WebUI, build jar
        env:
          ProductBuildType: Stable # as upstream's release builds; the version is pinned to the upstream base
        # downloadWebUI bundles the stable WebUI into the jar, as upstream's releases do
        run: ./gradlew :server:test ktlintCheck :server:downloadWebUI :server:shadowJar --stacktrace

      - name: Jar name and version
        id: jar
        run: |
          jar=$(ls server/build/Suwayomi-Server-*.jar)
          unzip -l "$jar" | grep -q ' WebUI.zip$' || { echo "WebUI.zip is not bundled in $jar"; exit 1; }
          echo "path=$jar" >> "$GITHUB_OUTPUT"
          # the reported version is pinned to the upstream base, so the image tag carries the fork revision
          echo "version=$(basename "$jar" .jar | sed 's/^Suwayomi-Server-//')-fork.r$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - if: env.PUBLISH == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: fork.Dockerfile
          build-args: JAR=${{ steps.jar.outputs.path }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ghcr.io/paymonr/suwayomi-server:${{ steps.jar.outputs.version }}
            ghcr.io/paymonr/suwayomi-server:main
